<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c1a"/>
      <stop offset="100%" stop-color="#060610"/>
    </linearGradient>
    <marker id="ecCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00e5ff"/>
    </marker>
    <marker id="ecGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00e676"/>
    </marker>
    <marker id="ecAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ffab40"/>
    </marker>
  </defs>

  <rect width="940" height="600" rx="12" fill="url(#ecomBg)" stroke="#1e1e38" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="40" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">Dockerized E-Commerce Microservices &amp; React SPA</text>
  <text x="40" y="62" fill="#8888a4" font-family="'Inter', sans-serif" font-size="12">Node.js, Express, MySQL, JWT &amp; React · Automated via Jenkins CI/CD &amp; Terraform IaC</text>

  <!-- Automation Bar -->
  <rect x="40" y="78" width="860" height="38" rx="6" fill="#121226" stroke="#2a2a4a" stroke-width="1"/>
  <text x="55" y="102" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">⚡ Automation Engine:</text>
  <text x="210" y="102" fill="#b388ff" font-family="'JetBrains Mono', monospace" font-size="11">Jenkins CI Multi-Branch Pipeline</text>
  <text x="480" y="102" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11">· Terraform IaC Cloud Infrastructure Provisioning</text>

  <!-- Client Browser -->
  <rect x="330" y="130" width="280" height="42" rx="8" fill="#14142b" stroke="#00e5ff" stroke-width="1.2"/>
  <text x="470" y="156" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">🌐 Client Browser (React SPA)</text>

  <line x1="470" y1="172" x2="470" y2="205" stroke="#00e5ff" stroke-width="2" marker-end="url(#ecCyan)"/>
  <text x="485" y="194" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10">Port 8080</text>

  <!-- Nginx API Gateway -->
  <rect x="230" y="205" width="480" height="50" rx="8" fill="#141432" stroke="#00e676" stroke-width="1.2"/>
  <text x="470" y="228" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="700">Nginx Reverse Proxy &amp; API Gateway (Port 8080)</text>
  <text x="470" y="246" fill="#8888a4" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Serves React SPA · Dynamic /api/* path routing to backend services</text>

  <!-- Arrows to 3 microservices -->
  <line x1="310" y1="255" x2="200" y2="295" stroke="#00e5ff" stroke-width="1.8" marker-end="url(#ecCyan)"/>
  <text x="225" y="275" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9">/api/auth/*</text>

  <line x1="470" y1="255" x2="470" y2="295" stroke="#00e676" stroke-width="1.8" marker-end="url(#ecGreen)"/>
  <text x="485" y="280" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="9">/api/products/*</text>

  <line x1="630" y1="255" x2="740" y2="295" stroke="#ffab40" stroke-width="1.8" marker-end="url(#ecAmber)"/>
  <text x="700" y="275" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="9">/api/orders/*</text>

  <!-- Microservices Tier -->
  <!-- Service 1: Auth -->
  <rect x="70" y="295" width="250" height="90" rx="8" fill="#121228" stroke="#00e5ff" stroke-width="1"/>
  <text x="195" y="322" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="600">Auth Service (:5001)</text>
  <text x="195" y="342" fill="#fff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">JWT Sign / Verify · bcryptjs</text>
  <text x="195" y="362" fill="#8888a4" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Target Schema: auth_db</text>

  <!-- Service 2: Product Catalog -->
  <rect x="345" y="295" width="250" height="90" rx="8" fill="#121228" stroke="#00e676" stroke-width="1"/>
  <text x="470" y="322" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="600">Product Service (:5002)</text>
  <text x="470" y="342" fill="#fff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Catalog, Categories, Search</text>
  <text x="470" y="362" fill="#8888a4" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Target Schema: catalog_db</text>

  <!-- Service 3: Order -->
  <rect x="620" y="295" width="250" height="90" rx="8" fill="#121228" stroke="#ffab40" stroke-width="1"/>
  <text x="745" y="322" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="600">Order Service (:5003)</text>
  <text x="745" y="342" fill="#fff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">ACID Transactions, User History</text>
  <text x="745" y="362" fill="#8888a4" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Target Schema: order_db</text>

  <!-- Arrows to Database -->
  <line x1="195" y1="385" x2="350" y2="440" stroke="#00e5ff" stroke-width="1.5" marker-end="url(#ecCyan)"/>
  <line x1="470" y1="385" x2="470" y2="440" stroke="#00e676" stroke-width="1.5" marker-end="url(#ecGreen)"/>
  <line x1="745" y1="385" x2="590" y2="440" stroke="#ffab40" stroke-width="1.5" marker-end="url(#ecAmber)"/>

  <!-- Database Tier -->
  <rect x="180" y="440" width="580" height="75" rx="8" fill="#161633" stroke="#ffab40" stroke-width="1.2"/>
  <text x="470" y="468" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle" font-weight="700">MySQL Database Cluster (Port 3306)</text>
  <text x="470" y="492" fill="#8888a4" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Isolated Databases: auth_db  |  catalog_db  |  order_db  · Docker Persistent Volume</text>

  <!-- Footer Banner -->
  <rect x="40" y="535" width="860" height="42" rx="6" fill="#101024" stroke="#1e1e38" stroke-width="1"/>
  <text x="470" y="561" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Multi-Container Docker Compose Orchestration · Containerized Microservice Boundaries · Zero State Leaks</text>
</svg>