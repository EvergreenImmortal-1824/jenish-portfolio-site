<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c1a"/>
      <stop offset="100%" stop-color="#060610"/>
    </linearGradient>
    <marker id="arrK8s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00e5ff"/>
    </marker>
  </defs>

  <rect width="920" height="480" rx="12" fill="url(#bgGrad4)" stroke="#1e1e38" stroke-width="1.5"/>

  <text x="40" y="42" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">Kubernetes &amp; Argo CD GitOps Continuous Delivery</text>
  <text x="40" y="64" fill="#8888a4" font-family="'Inter', sans-serif" font-size="12">Declarative GitOps Delivery with Argo CD &amp; Production Kubernetes Workloads</text>

  <!-- Git Repo -->
  <rect x="50" y="160" width="180" height="160" rx="8" fill="#14142b" stroke="#f05032" stroke-width="1.2"/>
  <text x="140" y="200" fill="#f05032" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="700">Git Manifest Repo</text>
  <text x="140" y="225" fill="#fff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Single Source of Truth</text>
  <text x="140" y="245" fill="#8888a4" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Deployments.yaml</text>
  <text x="140" y="260" fill="#8888a4" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Services.yaml</text>
  <text x="140" y="275" fill="#8888a4" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Ingress.yaml</text>

  <!-- Arrow to Argo CD -->
  <line x1="230" y1="240" x2="310" y2="240" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrK8s)"/>
  <text x="270" y="230" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Webhook Sync</text>

  <!-- Argo CD Controller -->
  <rect x="315" y="160" width="200" height="160" rx="8" fill="#14142b" stroke="#ef7b4d" stroke-width="1.2"/>
  <text x="415" y="200" fill="#ef7b4d" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="700">Argo CD Controller</text>
  <text x="415" y="225" fill="#fff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Continuous Reconciliation</text>
  <text x="415" y="250" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">✔ State: Synced</text>
  <text x="415" y="270" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">✔ Health: Healthy</text>
  <text x="415" y="290" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Auto Self-Healing</text>

  <!-- Arrow to K8s -->
  <line x1="515" y1="240" x2="595" y2="240" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrK8s)"/>
  <text x="555" y="230" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Reconcile State</text>

  <!-- Kubernetes Cluster Box -->
  <rect x="600" y="120" width="270" height="240" rx="10" fill="#0c0c1e" stroke="#326ce5" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="735" y="148" fill="#326ce5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">☸️ Kubernetes Cluster</text>

  <!-- Pods / Workloads -->
  <rect x="625" y="165" width="220" height="50" rx="6" fill="#141432" stroke="#00e676" stroke-width="1"/>
  <text x="735" y="188" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="600">Deployment Pods (ReplicaSet)</text>
  <text x="735" y="203" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Liveness &amp; Readiness Probes</text>

  <rect x="625" y="225" width="220" height="45" rx="6" fill="#141432" stroke="#00e5ff" stroke-width="1"/>
  <text x="735" y="247" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="600">ClusterIP &amp; NodePort Services</text>
  <text x="735" y="260" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Internal Service Mesh Routing</text>

  <rect x="625" y="280" width="220" height="45" rx="6" fill="#141432" stroke="#ffab40" stroke-width="1"/>
  <text x="735" y="302" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="600">Ingress Controller</text>
  <text x="735" y="315" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">TLS Termination &amp; Public Edge</text>

  <!-- Footer status -->
  <rect x="50" y="385" width="820" height="45" rx="6" fill="#121226" stroke="#1e1e38" stroke-width="1"/>
  <text x="460" y="412" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Zero Configuration Drift · Automated Canary / Rolling Updates · Instant Git Rollbacks</text>
</svg>