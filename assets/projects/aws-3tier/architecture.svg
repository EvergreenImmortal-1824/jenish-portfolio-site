<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c1a"/>
      <stop offset="100%" stop-color="#060610"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00e5ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00e676"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ffab40"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" rx="12" fill="url(#bgGrad)" stroke="#1e1e38" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="40" y="42" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" letter-spacing="0.5">CloudScale-3Tier-Engine Architecture</text>
  <text x="40" y="64" fill="#8888a4" font-family="'Inter', sans-serif" font-size="12">Multi-AZ High-Availability VPC (us-east-1a / us-east-1b) with Automated CI/CD Engine</text>

  <!-- Client Browser / Users -->
  <rect x="370" y="85" width="220" height="42" rx="8" fill="#14142b" stroke="#00e5ff" stroke-width="1.2" filter="url(#cardGlow)"/>
  <text x="480" y="111" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">🌐 Client / Public Users</text>

  <line x1="480" y1="127" x2="480" y2="155" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="145" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10">HTTPS / 443</text>

  <!-- Edge Layer: Route 53 & AWS WAF -->
  <rect x="330" y="155" width="300" height="44" rx="8" fill="#181832" stroke="#ffab40" stroke-width="1.2"/>
  <text x="480" y="182" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="600">🛡️ Route 53 DNS + AWS WAF Shield</text>

  <line x1="480" y1="199" x2="480" y2="225" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="216" fill="#8888a4" font-family="'JetBrains Mono', monospace" font-size="10">IGW</text>

  <!-- VPC Container -->
  <rect x="30" y="225" width="900" height="370" rx="10" fill="none" stroke="#2a2a4a" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="46" y="246" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">AWS VPC (10.0.0.0/16)</text>

  <!-- TIER 1: PUBLIC WEB TIER -->
  <rect x="50" y="260" width="860" height="75" rx="8" fill="#101026" stroke="#1e1e38" stroke-width="1"/>
  <text x="65" y="280" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">TIER 1: PUBLIC SUBNETS (10.0.1.0/24 &amp; 10.0.11.0/24)</text>

  <rect x="220" y="290" width="240" height="36" rx="6" fill="#161633" stroke="#00e5ff" stroke-width="1"/>
  <text x="340" y="313" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">⚖️ Public Frontend ALB (Port 80)</text>

  <rect x="490" y="290" width="170" height="36" rx="6" fill="#161633" stroke="#ffab40" stroke-width="1"/>
  <text x="575" y="313" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">⚡ NAT Gateway (Egress)</text>

  <rect x="690" y="290" width="200" height="36" rx="6" fill="#161633" stroke="#b388ff" stroke-width="1"/>
  <text x="790" y="313" fill="#b388ff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">🛠️ Jenkins CI + SonarQube</text>

  <line x1="340" y1="326" x2="340" y2="360" stroke="#00e676" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="350" y="348" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="9">Forward HTTP</text>

  <!-- TIER 2: PRIVATE APPLICATION TIER -->
  <rect x="50" y="360" width="860" height="110" rx="8" fill="#101026" stroke="#1e1e38" stroke-width="1"/>
  <text x="65" y="380" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">TIER 2: PRIVATE APPLICATION SUBNETS (10.0.2.0/24 &amp; 10.0.12.0/24 - ASG)</text>

  <!-- Nginx Frontend Nodes -->
  <rect x="70" y="395" width="220" height="60" rx="6" fill="#161633" stroke="#00e676" stroke-width="1"/>
  <text x="180" y="418" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">Nginx Web Cluster (ASG)</text>
  <text x="180" y="438" fill="#8888a4" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">React 18 SPA Assets + Reverse Proxy</text>

  <!-- Arrow to Internal ALB -->
  <line x1="290" y1="425" x2="340" y2="425" stroke="#00e5ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="315" y="418" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">/api/</text>

  <!-- Internal ALB -->
  <rect x="345" y="402" width="180" height="46" rx="6" fill="#14142f" stroke="#00e5ff" stroke-width="1"/>
  <text x="435" y="423" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="600">Internal Backend ALB</text>
  <text x="435" y="439" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Port 80 → 4000</text>

  <!-- Arrow to Node.js backend -->
  <line x1="525" y1="425" x2="575" y2="425" stroke="#00e676" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Node.js Backend API Nodes -->
  <rect x="580" y="395" width="310" height="60" rx="6" fill="#161633" stroke="#00e676" stroke-width="1"/>
  <text x="735" y="418" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">Node.js Express REST API (ASG)</text>
  <text x="735" y="438" fill="#8888a4" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Port 4000 · Connection Pool Failover · /health</text>

  <!-- Arrow from Node.js to DB -->
  <line x1="735" y1="455" x2="735" y2="495" stroke="#ffab40" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="745" y="480" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="9">MySQL 3306</text>

  <!-- TIER 3: ISOLATED DATA TIER -->
  <rect x="50" y="495" width="860" height="85" rx="8" fill="#101026" stroke="#1e1e38" stroke-width="1"/>
  <text x="65" y="515" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">TIER 3: ISOLATED DATA SUBNETS (10.0.3.0/24 &amp; 10.0.13.0/24)</text>

  <rect x="200" y="525" width="280" height="44" rx="6" fill="#161633" stroke="#ffab40" stroke-width="1"/>
  <text x="340" y="546" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">Amazon RDS MySQL (Primary - 1a)</text>
  <text x="340" y="561" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Active Transactional Storage (Port 3306)</text>

  <!-- Sync Replication Line -->
  <line x1="480" y1="547" x2="560" y2="547" stroke="#00e5ff" stroke-dasharray="3,3" stroke-width="1.8"/>
  <text x="520" y="541" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Sync Repl</text>

  <rect x="565" y="525" width="320" height="44" rx="6" fill="#161633" stroke="#ffab40" stroke-width="1"/>
  <text x="725" y="546" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">Amazon RDS Multi-AZ Standby (1b)</text>
  <text x="725" y="561" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Hot Standby Automatic Failover Target</text>

</svg>