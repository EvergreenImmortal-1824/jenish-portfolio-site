<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c1a"/>
      <stop offset="100%" stop-color="#060610"/>
    </linearGradient>
    <marker id="arrGen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00e676"/>
    </marker>
  </defs>

  <rect width="920" height="480" rx="12" fill="url(#bgGrad3)" stroke="#1e1e38" stroke-width="1.5"/>

  <text x="40" y="42" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">Jenkins CI/CD Enterprise Automation Engine</text>
  <text x="40" y="64" fill="#8888a4" font-family="'Inter', sans-serif" font-size="12">Automated Build, SonarQube Quality Gates, Trivy CVE Security &amp; Nexus Archiving</text>

  <!-- Pipeline Stages Container -->
  <rect x="40" y="90" width="840" height="350" rx="10" fill="#101026" stroke="#2a2a4a" stroke-width="1"/>

  <!-- Row 1 Stages -->
  <!-- Stage 1: Checkout -->
  <rect x="70" y="120" width="160" height="75" rx="6" fill="#161633" stroke="#00e5ff" stroke-width="1"/>
  <text x="150" y="145" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">1. Git Checkout</text>
  <text x="150" y="165" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Branch tracking</text>

  <!-- Arrow -->
  <line x1="230" y1="157" x2="270" y2="157" stroke="#00e676" stroke-width="2" marker-end="url(#arrGen)"/>

  <!-- Stage 2: SonarQube -->
  <rect x="270" y="120" width="170" height="75" rx="6" fill="#161633" stroke="#00e676" stroke-width="1"/>
  <text x="355" y="145" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">2. SonarQube</text>
  <text x="355" y="165" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Static code audit</text>

  <!-- Arrow -->
  <line x1="440" y1="157" x2="480" y2="157" stroke="#00e676" stroke-width="2" marker-end="url(#arrGen)"/>

  <!-- Stage 3: Quality Gate -->
  <rect x="480" y="120" width="170" height="75" rx="6" fill="#161633" stroke="#ffab40" stroke-width="1"/>
  <text x="565" y="145" fill="#ffab40" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">3. Quality Gate</text>
  <text x="565" y="165" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Fail-fast guard</text>

  <!-- Arrow -->
  <line x1="650" y1="157" x2="690" y2="157" stroke="#00e676" stroke-width="2" marker-end="url(#arrGen)"/>

  <!-- Stage 4: Trivy -->
  <rect x="690" y="120" width="160" height="75" rx="6" fill="#161633" stroke="#ff5252" stroke-width="1"/>
  <text x="770" y="145" fill="#ff5252" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">4. Trivy Security</text>
  <text x="770" y="165" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">CVE &amp; Vuln scan</text>

  <!-- Turn down arrow -->
  <path d="M 770 195 L 770 240 L 770 240 L 770 250" fill="none" stroke="#00e676" stroke-width="2" marker-end="url(#arrGen)"/>

  <!-- Row 2 Stages -->
  <!-- Stage 5: Artifacts -->
  <rect x="690" y="260" width="160" height="75" rx="6" fill="#161633" stroke="#b388ff" stroke-width="1"/>
  <text x="770" y="285" fill="#b388ff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">5. Sonatype Nexus</text>
  <text x="770" y="305" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Archive version zip</text>

  <!-- Arrow left -->
  <line x1="690" y1="297" x2="650" y2="297" stroke="#00e676" stroke-width="2" marker-end="url(#arrGen)"/>

  <!-- Stage 6: Docker Build -->
  <rect x="480" y="260" width="170" height="75" rx="6" fill="#161633" stroke="#2496ed" stroke-width="1"/>
  <text x="565" y="285" fill="#2496ed" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">6. Docker Build</text>
  <text x="565" y="305" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Hardened image</text>

  <!-- Arrow left -->
  <line x1="480" y1="297" x2="440" y2="297" stroke="#00e676" stroke-width="2" marker-end="url(#arrGen)"/>

  <!-- Stage 7: Registry Push -->
  <rect x="270" y="260" width="170" height="75" rx="6" fill="#161633" stroke="#2496ed" stroke-width="1"/>
  <text x="355" y="285" fill="#2496ed" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">7. Registry Push</text>
  <text x="355" y="305" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Publish to Docker Hub</text>

  <!-- Arrow left -->
  <line x1="270" y1="297" x2="230" y2="297" stroke="#00e676" stroke-width="2" marker-end="url(#arrGen)"/>

  <!-- Stage 8: Webhook Alerts -->
  <rect x="70" y="260" width="160" height="75" rx="6" fill="#161633" stroke="#00e676" stroke-width="1"/>
  <text x="150" y="285" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">8. Teams / Webhook</text>
  <text x="150" y="305" fill="#8888a4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Build status alert</text>

  <!-- Bottom banner -->
  <rect x="70" y="365" width="780" height="50" rx="6" fill="#121226" stroke="#1e1e38" stroke-width="1"/>
  <text x="460" y="395" fill="#00e676" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">🛡️ Automated Quality Gates · Shift-Left Security Audits · Zero Downtime Artifact Publishing</text>
</svg>